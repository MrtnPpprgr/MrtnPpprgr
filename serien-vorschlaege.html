    text-align:center;
    position:relative;
    overflow:hidden;
  }
  header .eyebrow{
    display:inline-block;
    font-family:'Baloo 2',cursive;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:0.85rem;
    background:var(--ink);
    color:var(--cream);
    padding:8px 20px;
    border-radius:30px;
  }
  header h1{
    color:var(--cream);
    font-size:clamp(2rem,6vw,3.4rem);
    margin:18px auto 10px;
    max-width:700px;
    text-shadow:3px 3px 0 rgba(43,33,64,0.25);
  }
  header p{
    color:var(--cream);
    font-weight:700;
    max-width:520px;
    margin:0 auto;
    opacity:0.95;
  }
  .clapper{
    position:absolute;
    font-size:3rem;
    animation:wiggle 3s ease-in-out infinite;
  }
  .clapper.c1{ top:30px; left:8%; animation-delay:0.2s;}
  .clapper.c2{ top:60px; right:10%; animation-delay:0.8s;}
  @keyframes wiggle{
    0%,100%{transform:rotate(-8deg);}
    50%{transform:rotate(8deg);}
  }

  main{
    max-width:1080px;
    margin:-40px auto 0;
    padding:0 20px 80px;
    position:relative;
    z-index:2;
  }

  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:24px;
  }

  .card{
    background:var(--cream);
    border:3px solid var(--ink);
    border-radius:18px;
    padding:22px;
    box-shadow:6px 6px 0 var(--ink);
    display:flex;
    flex-direction:column;
    transition:transform 0.15s ease;
  }
  .card:hover{transform:translateY(-4px);}
  .card .emoji{font-size:2.6rem; margin-bottom:10px;}
  .card h3{margin:0 0 6px; font-size:1.2rem;}
  .card .genre{
    display:inline-block;
    font-size:0.75rem;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
    background:var(--mint);
    color:var(--ink);
    padding:3px 10px;
    border-radius:20px;
    margin-bottom:10px;
    align-self:flex-start;
  }
  .card p.desc{
    flex-grow:1;
    font-size:0.95rem;
    font-weight:600;
    color:#5a4f73;
    margin:0 0 16px;
  }
  .card a.watch-btn{
    display:inline-block;
    text-align:center;
    text-decoration:none;
    font-family:'Baloo 2',cursive;
    font-weight:700;
    background:var(--accent);
    color:var(--cream);
    padding:10px 16px;
    border-radius:12px;
    border:3px solid var(--ink);
    box-shadow:3px 3px 0 var(--ink);
    transition:transform 0.1s ease;
  }
  .card a.watch-btn:hover{transform:translate(-2px,-2px);}
  .card a.watch-btn:active{transform:translate(1px,1px); box-shadow:1px 1px 0 var(--ink);}

  .hint{
    max-width:700px;
    margin:50px auto 0;
    background:rgba(111,207,151,0.25);
    border:3px dashed var(--mint);
    border-radius:16px;
    padding:18px 22px;
    font-weight:700;
    font-size:0.95rem;
    color:#2f5f45;
  }
  .hint code{
    background:rgba(0,0,0,0.08);
    padding:2px 6px;
    border-radius:6px;
    font-size:0.85rem;
  }
</style>
